<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vendora - Vendor Dashboard</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- VIP Vendora theme (custom) -->
    <style>
      :root {
        --vendora-purple: #5b21b6;
        --vendora-gold: #ffd166;
      }
      .nav-vendora {
        background: linear-gradient(90deg, var(--vendora-purple), #7c3aed);
        color: white;
      }
      .btn-vendora {
        background: var(--vendora-purple);
        color: #fff;
        border: none;
      }
    </style>
  </head>
  <body>
    <nav class="navbar nav-vendora p-3 mb-4">
      <div class="container">
        <a class="navbar-brand text-white" href="#">Vendora (Vendor)</a>
      </div>
    </nav>

    <main class="container">
      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
